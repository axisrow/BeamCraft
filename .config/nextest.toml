# cargo nextest configuration (https://nexte.st/config.html).
#
# The recorded gate uses unfiltered gate-* profiles plus mandatory doctests.
# Execution budgets exclude compilation and archive preparation/extraction.

[profile.default]
retries = 0
slow-timeout = { period = "30s", terminate-after = 4, grace-period = "5s", on-timeout = "fail" }

# The slow tier (#738 P6, resolving the P1 stopgap): the default budget is the 120-second
# table in docs/plan/test-gate.md, and the only exceptions are these named overrides, each
# 30 s x 8 = 240 seconds - the R01 founding budget. Membership is for tests that must stay
# at deliberate scale or deliberately attach a large fixture, measured green well below the
# default cap unloaded, but load-sensitive enough on the shared machine (2-3.5x inflation is
# the recorded evidence) that a budget kill would read as a regression. Every entry is an
# exact-name filter, validated against the workspace's own binaries at parse time, and is
# reviewed like code; the gate report lists the budgets. Additions need a measured median
# and a note naming what the scale is for. Custom profiles inherit default's settings, so
# the gate, fast and ci profiles enforce this too. The gate's fixture workspaces reuse this
# file without the cli test binary (issue #529).
[[profile.default.overrides]]
filter = 'test(=reference::a_reply_lists_a_bounded_number_of_foreign_prims_however_many_the_source_has)'
slow-timeout = { period = "30s", terminate-after = 8, grace-period = "5s", on-timeout = "fail" }

[[profile.default.overrides]]
filter = 'test(=alpha_scenario_expanded::expanded_alpha_runs_tools_views_regressions_and_exact_outputs)'
slow-timeout = { period = "30s", terminate-after = 8, grace-period = "5s", on-timeout = "fail" }

[[profile.default.overrides]]
filter = 'test(=alpha_scenario_expanded::expanded_alpha_published_surface_regressions_and_exact_outputs)'
slow-timeout = { period = "30s", terminate-after = 8, grace-period = "5s", on-timeout = "fail" }

[[profile.default.overrides]]
filter = 'test(=offline_clients::two_offline_workspaces_publish_independent_elements_and_lose_nothing)'
slow-timeout = { period = "30s", terminate-after = 8, grace-period = "5s", on-timeout = "fail" }

[profile.gate-full]
default-filter = "all()"
global-timeout = "600s"
[profile.gate-full.junit]
path = "junit.xml"

[profile.gate-cli]
default-filter = "all()"
global-timeout = "300s"
[profile.gate-cli.junit]
path = "junit.xml"

[profile.gate-ci]
default-filter = "all()"
global-timeout = "180s"
[profile.gate-ci.junit]
path = "junit.xml"

[profile.fast]
# Inner-loop default: everything except the integration suites that each measure
# at least ~40 s of serial time on the reference Mac (baseline re-measured 2026-11-20,
# the #738 P6 line move): cli alpha_scenario_expanded, offline_clients, model_checks,
# export_ifc, numbering_approval, numbering, libraries, environments and pick (modules of
# the one `cli` test binary); host operation_evidence, recovery, revision and compaction
# (modules of the one `host` test binary); kernel g09_budget_fuzz and g05_profile_extrusion
# (modules of the one `kernel` test binary). Nothing is removed: the skipped suites run in
# the default profile and in CI.
# Re-measure and move the line when a suite outgrows this list; an explicit
# filter on the command line overrides default-filter, so any skipped test stays
# reachable in this profile.
default-filter = '''not (
    (package(beamcraft-cli) and binary(cli) and test(
        /^(alpha_scenario_expanded|offline_clients|model_checks|export_ifc|numbering_approval|numbering|libraries|environments|pick)::/))
    or (package(beamcraft-host) and binary(host) and test(/^(operation_evidence|recovery|revision|compaction)::/))
    or (package(beamcraft-kernel) and binary(kernel) and test(/^(g09_budget_fuzz|g05_profile_extrusion)::/))
)'''

[profile.ci]
# CI's profile: everything the `default` profile runs, with no filter of its own, plus a
# JUnit report per shard. The `ci-ok` job checks those reports against the full test list
# (tools/ci-gate.py), so a shard that loses tests, or a filter that drops some, fails CI.
retries = 0

[profile.ci.junit]
path = "junit.xml"
