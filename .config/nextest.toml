# cargo nextest configuration (https://nexte.st/config.html).
#
# The recorded gate uses unfiltered gate-* profiles plus mandatory doctests.
# Execution budgets exclude compilation and archive preparation/extraction.

[profile.default]
retries = 0
slow-timeout = { period = "30s", terminate-after = 4, grace-period = "5s", on-timeout = "fail" }

[profile.gate-full]
default-filter = "all()"
global-timeout = "600s"
[profile.gate-full.junit]
path = "junit.xml"

[profile.gate-cli]
default-filter = "all()"
global-timeout = "300s"
[profile.gate-cli.junit]
path = "junit.xml"

[profile.gate-ci]
default-filter = "all()"
global-timeout = "180s"
[profile.gate-ci.junit]
path = "junit.xml"

[profile.fast]
# Inner-loop default: everything except the integration suites that keep the
# remaining serial mass near ~800 s, which is ~80 s of wall clock on the
# reference Mac (re-measured 2026-11-01 for issue #285, interleaved A/B): the
# cli IO-heavy suites export_ifc, numbering_approval, numbering, libraries,
# environments and pick (modules of the one `cli` test binary) and the host
# recovery, revision and compaction binaries. environments stays out for its
# 30-64 s tail even at a ~38 s median. Other long cli suites
# (alpha_scenario_expanded, offline_clients, reference, bolt_groups, rebase)
# measured wall-neutral in the loop: they fill parallel slack, so excluding them
# buys no time and loses signal. The kernel's g09_budget_fuzz and
# g05_profile_extrusion fell to 12-16 s after the one-binary consolidation and
# run here again. Wall clock degrades to 110-140 s under unrelated machine load,
# not under suite growth.
# Nothing is removed: the skipped suites run in the default profile and in CI.
# Re-measure and move the line when a suite outgrows this list; an explicit
# filter on the command line overrides default-filter, so any skipped test stays
# reachable in this profile.
default-filter = '''not (
    (package(beamcraft-cli) and binary(cli) and test(
        /^(export_ifc|numbering_approval|numbering|libraries|environments|pick)::/))
    or (package(beamcraft-host) and (binary(recovery) or binary(revision) or binary(compaction)))
)'''

[profile.ci]
# CI's profile: everything the `default` profile runs, with no filter of its own, plus a
# JUnit report per shard. The `ci-ok` job checks those reports against the full test list
# (tools/ci-gate.py), so a shard that loses tests, or a filter that drops some, fails CI.
retries = 0

[profile.ci.junit]
path = "junit.xml"
