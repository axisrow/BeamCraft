# cargo nextest configuration (https://nexte.st/config.html).
#
# The recorded gate uses unfiltered gate-* profiles plus mandatory doctests.
# Execution budgets exclude compilation and archive preparation/extraction.

[profile.default]
retries = 0
slow-timeout = { period = "30s", terminate-after = 4, grace-period = "5s", on-timeout = "fail" }

[profile.gate-full]
default-filter = "all()"
global-timeout = "600s"
[profile.gate-full.junit]
path = "junit.xml"

[profile.gate-cli]
default-filter = "all()"
global-timeout = "300s"
[profile.gate-cli.junit]
path = "junit.xml"

[profile.gate-ci]
default-filter = "all()"
global-timeout = "180s"
[profile.gate-ci.junit]
path = "junit.xml"

[profile.fast]
# Inner-loop default: everything except the integration suites that each measure
# at least ~40 s of serial time on the reference Mac (baseline 2026-10-25):
# cli export_ifc, numbering_approval, numbering, libraries,
# environments and pick (modules of the one `cli` test binary); host recovery,
# revision and compaction (modules of the one `host` test binary); kernel
# g09_budget_fuzz and g05_profile_extrusion (modules of the one `kernel` test binary).
# Nothing is removed: the skipped suites run in the default profile and in CI.
# Re-measure and move the line when a suite outgrows this list; an explicit
# filter on the command line overrides default-filter, so any skipped test stays
# reachable in this profile.
default-filter = '''not (
    (package(beamcraft-cli) and binary(cli) and test(
        /^(export_ifc|numbering_approval|numbering|libraries|environments|pick)::/))
    or (package(beamcraft-host) and binary(host) and test(/^(recovery|revision|compaction)::/))
    or (package(beamcraft-kernel) and binary(kernel) and test(/^(g09_budget_fuzz|g05_profile_extrusion)::/))
)'''

[profile.ci]
# CI's profile: everything the `default` profile runs, with no filter of its own, plus a
# JUnit report per shard. The `ci-ok` job checks those reports against the full test list
# (tools/ci-gate.py), so a shard that loses tests, or a filter that drops some, fails CI.
retries = 0

[profile.ci.junit]
path = "junit.xml"
