[package]
name = "beamcraft-host"
description = "Native BeamCraft host: verified storage, revisions, the outcome ledger and the local coordinator."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
authors.workspace = true
# The integration suites build into one `host` test binary (`tests/host.rs`): one link
# instead of six.
autotests = false

[[test]]
name = "host"
path = "tests/host.rs"

[dependencies]
beamcraft-model.workspace = true
beamcraft-json.workspace = true
beamcraft-engine = { path = "../engine", version = "0.0.1" }

[lints]
workspace = true
