[package]
name = "beamcraft-engine"
description = "BeamCraft engine API: pinned view snapshots, deltas, view settings and selection."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
authors.workspace = true
# The integration suites build into one `engine` test binary (`tests/engine.rs`): one link
# instead of six.
autotests = false

[[test]]
name = "engine"
path = "tests/engine.rs"

[dependencies]
beamcraft-geom.workspace = true
beamcraft-model.workspace = true
beamcraft-kernel = { path = "../kernel", version = "0.0.1" }

[lints]
workspace = true
