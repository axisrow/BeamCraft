[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "tools/fixtures"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MPL-2.0"
rust-version = "1.96"
repository = "https://github.com/Apibim-com/BeamCraft"
authors = ["Apibim"]

[workspace.dependencies]
# internal
beamcraft-geom = { path = "crates/geom", version = "0.0.1" }
beamcraft-model = { path = "crates/model", version = "0.0.1" }
beamcraft-json = { path = "crates/json", version = "0.0.1" }

# Patched eframe 0.37.0 (issue #149): upstream embeds its default `data/icon.png` (unknown
# author and licence) into every binary via `include_bytes!`, which `AGENTS.md` §1 forbids.
# The patch is a dependency, not vendored code: the fork branch
# `patch/remove-default-icon-0.37.0` of `Apibim-com/eframe` is that exact crates.io release
# with the icon bytes removed and the fallback replaced by a generated placeholder, and with the
# Windows window icon loaded from the executable's icon resource when it has one (#225), pinned
# by rev; the fork's PATCH.md records the archive checksum and the diff.
[patch.crates-io]
eframe = { git = "https://github.com/Apibim-com/eframe", rev = "6683d5b7cc150d51212b61cdb774422a6090911b" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
# Every file, model and keystroke is untrusted input: no panics outside tests.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unreachable = "warn"
indexing_slicing = "warn"

[profile.release]
# Local optimized builds prioritize compile time. Distribution builds retain the
# full optimization settings below; neither profile changes runtime checks.
opt-level = 0
lto = "off"
codegen-units = 16
strip = "symbols"
debug-assertions = false
overflow-checks = false

# Keep our engineering code optimized without overriding Cargo's cheap default
# for host build scripts and proc macros (a package."*" override would do that).
[profile.release.package]
beamcraft-boundaries = { opt-level = 3 }
beamcraft-cli = { opt-level = 3 }
beamcraft-engine = { opt-level = 3 }
beamcraft-fixtures = { opt-level = 3 }
beamcraft-geom = { opt-level = 3 }
beamcraft-host = { opt-level = 3 }
beamcraft-ifc = { opt-level = 3 }
beamcraft-json = { opt-level = 3 }
beamcraft-kernel = { opt-level = 3 }
beamcraft-layer-engine = { opt-level = 3 }
beamcraft-model = { opt-level = 3 }
beamcraft-ui = { opt-level = 3 }

[profile.dist]
inherits = "release"
opt-level = 3
lto = "thin"
codegen-units = 1
