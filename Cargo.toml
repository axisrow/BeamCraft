[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "tools/fixtures"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MPL-2.0"
rust-version = "1.96"
repository = "https://github.com/Apibim-com/BeamCraft"
authors = ["Apibim"]

[workspace.dependencies]
# internal
beamcraft-geom = { path = "crates/geom", version = "0.0.1" }
beamcraft-model = { path = "crates/model", version = "0.0.1" }
beamcraft-protocol = { path = "crates/protocol", version = "0.0.1" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
# Every file, model and keystroke is untrusted input: no panics outside tests.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unreachable = "warn"
indexing_slicing = "warn"

# Tests hash whole worker binaries (about 110 MB in a debug build) with the model's SHA-256
# before every spawn; unoptimized, that takes about 12 s each and parallel tests on a small CI
# runner exceed the 30 s worker deadline. Optimizing this one pure crate keeps debug assertions
# and overflow checks and makes the hash about 15 times faster.
[profile.dev.package.beamcraft-model]
opt-level = 3

[profile.release]
# Local optimized builds prioritize compile time. Distribution builds retain the
# full optimization settings below; neither profile changes runtime checks.
opt-level = 0
lto = "off"
codegen-units = 16
strip = "symbols"
debug-assertions = false
overflow-checks = false

# Keep our engineering code optimized without overriding Cargo's cheap default
# for host build scripts and proc macros (a package."*" override would do that).
[profile.release.package]
beamcraft-boundaries = { opt-level = 3 }
beamcraft-cli = { opt-level = 3 }
beamcraft-engine = { opt-level = 3 }
beamcraft-fixtures = { opt-level = 3 }
beamcraft-geom = { opt-level = 3 }
beamcraft-host = { opt-level = 3 }
beamcraft-ifc = { opt-level = 3 }
beamcraft-kernel = { opt-level = 3 }
beamcraft-layer-engine = { opt-level = 3 }
beamcraft-model = { opt-level = 3 }
beamcraft-protocol = { opt-level = 3 }
beamcraft-ui = { opt-level = 3 }

[profile.dist]
inherits = "release"
opt-level = 3
lto = "thin"
codegen-units = 1
