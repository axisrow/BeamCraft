name: Upstream mirror

# Mirror a merged fork PR to upstream: the closed-PR event carries the merge
# commit, workflow_dispatch re-runs a mirroring by PR number. The script is
# the single implementation (local run and the workflow share it). A red run
# is the alarm (owner decision), matching the fork-sync contract.
on:
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      pr-number:
        description: Merged fork PR number to mirror
        required: true
        type: number

env:
  CARGO_TERM_COLOR: always

# A run must not overlap itself; queued, not cancelled, so nothing is lost.
concurrency:
  group: upstream-mirror
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  mirror:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'master')
    name: mirror to upstream
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Secrets cannot appear in step conditions directly; mirror the presence
      # check into env. Until the secret exists the run stays green and the
      # mirroring happens locally (bash tools/upstream-mirror.sh mirror <n>).
      HAS_UPSTREAM_SYNC_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN != '' }}
    steps:
      # ref: master keeps the script's clean-tree guard meaningful; full
      # history is needed for the merge commit's parents.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          fetch-depth: 0

      # The script guards on both remotes; checkout configures only origin.
      - name: Add the upstream remote
        run: git remote add upstream https://github.com/Apibim-com/BeamCraft.git

      - name: Identify the committer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # The token must read the fork and open PRs in upstream: one fine-grained
      # PAT covering both repositories (Contents R on the fork, Contents and
      # pull requests R/W on upstream). GITHUB_TOKEN cannot cross repositories.
      - name: Mirror
        if: env.HAS_UPSTREAM_SYNC_TOKEN == 'true'
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN }}
        run: bash tools/upstream-mirror.sh mirror "${{ github.event.pull_request.number || inputs.pr-number }}"

      - name: Mirroring skipped, no UPSTREAM_SYNC_TOKEN
        if: env.HAS_UPSTREAM_SYNC_TOKEN != 'true'
        run: |
          echo "UPSTREAM_SYNC_TOKEN is not set; automatic mirroring is off."
          echo "Mirror by hand meanwhile: bash tools/upstream-mirror.sh mirror <pr-number>"
