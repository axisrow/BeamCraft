name: Release

# Push a tag like v0.1.0 to build binaries and attach them to a GitHub release.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc, kind: win }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, kind: linux }
          - { os: macos-latest, target: aarch64-apple-darwin, kind: macos }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: release-${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p beamcraft-cli -p beamcraft-ui

      - name: Package
        shell: bash
        run: |
          asset="$(bash packaging/package.sh "${{ matrix.target }}" "${{ matrix.kind }}" "${{ github.ref_name }}")"
          echo "ASSET=$asset" >> "$GITHUB_ENV"

      # Q02 rehearsal smoke: a fresh install must run the CLI from the extracted package,
      # and the font and (on macOS) the ad-hoc signature must be in place. The UI window
      # check stays a manual step on each OS (see docs/development.md).
      - name: Smoke test the package
        shell: bash
        run: |
          dir="$(mktemp -d)"
          if [ "${{ matrix.kind }}" = win ]; then
            7z x "$ASSET" -o"$dir" >/dev/null
          else
            tar xzf "$ASSET" -C "$dir"
          fi
          cd "$dir"/beamcraft-*
          if [ "${{ matrix.kind }}" = macos ]; then
            codesign --verify BeamCraft.app
            ./BeamCraft.app/Contents/MacOS/beamcraft --version
            test -f BeamCraft.app/Contents/MacOS/beamcraft-ui
            test -f BeamCraft.app/Contents/MacOS/beamcraft-usd-worker
            test -f BeamCraft.app/Contents/Resources/assets/fonts/inter/Inter-Regular.ttf
          else
            if [ "${{ matrix.kind }}" = win ]; then
              ./beamcraft.exe --version
              test -f beamcraft-ui.exe
              test -f beamcraft-usd-worker.exe
            else
              ./beamcraft --version
              test -f beamcraft-ui
              test -f beamcraft-usd-worker
            fi
            test -f assets/fonts/inter/Inter-Regular.ttf
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.ASSET }}
          path: ${{ env.ASSET }}

  publish:
    name: publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/* --repo "${{ github.repository }}" --generate-notes
