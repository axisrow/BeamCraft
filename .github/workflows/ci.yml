name: CI

# Canonical CI workflow: the single form shared by every BeamCraft repository. Anything
# repository-specific belongs in its own workflow file beside this one, never inline
# here, so syncing the repositories never conflicts in this path. Complete-workspace
# test execution lives in ci-platform.yml beside this file (owner decision of
# 2026-11-05); this wall stays receipt-gated and fast.

on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Source PR with a current local report (optional for an integrated tree)'
        type: string
        required: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_TEST_OPT_LEVEL: 1
  CARGO_PROFILE_TEST_DEBUG_ASSERTIONS: true
  CARGO_PROFILE_TEST_OVERFLOW_CHECKS: true

defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  plan:
    name: validate local test report
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      oses: ${{ steps.plan.outputs.oses }}
      primary: ${{ steps.plan.outputs.primary }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - id: plan
        name: Require fresh evidence and select the two other platforms
        run: cargo run --locked -p beamcraft-test-gate -- ci-plan
        env:
          GH_TOKEN: ${{ github.token }}

  quality:
    name: quality (${{ matrix.os }})
    needs: plan
    runs-on: ${{ matrix.os }}
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.plan.outputs.oses || '[]') }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Format
        if: matrix.os == needs.plan.outputs.primary
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Verify original fixtures
        run: cargo run --locked -p beamcraft-fixtures -- verify --dir tests/fixtures/f07
      - name: Check module boundaries
        run: cargo run --locked -p beamcraft-boundaries -- check
      - name: Docs
        if: matrix.os == needs.plan.outputs.primary
        run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  build-timings:
    needs: plan
    name: cold release (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    # The cold-build gate rides master pushes (and dispatch): a release is cut
    # from a master tag, so master has always passed the gate before a release.
    # PR runs keep the ~2 min of hosted runners off the critical window.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        # The macOS leg is build-time evidence (#153), not a test gate. On pull requests it took
        # one of the five macOS runners while the macOS test shards waited, so it runs on pushes
        # to master and on manual runs. The Linux leg still builds the release profile on every
        # pull request.
        include: ${{ fromJSON(github.event_name == 'pull_request' && '[{"os":"ubuntu-latest","target":"x86_64-unknown-linux-gnu"}]' || '[{"os":"ubuntu-latest","target":"x86_64-unknown-linux-gnu"},{"os":"macos-15","target":"aarch64-apple-darwin"}]') }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      # Download outside the measured interval, but never restore compiled objects.
      # Hosted macOS is useful evidence, not the reference Apple M5 acceptance.
      - run: cargo fetch --locked --target ${{ matrix.target }}
      - name: Measure compiler-cold release build
        run: bash tools/build-timings.sh --target ${{ matrix.target }} --output target/build-timings
        env:
          CARGO_NET_OFFLINE: "true"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: build-timings-${{ matrix.target }}
          path: |
            target/build-timings/metadata.txt
            target/build-timings/build.log
            target/build-timings/target/cargo-timings/*.html
          if-no-files-found: error

  wasm:
    needs: plan
    name: wasm32 check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: wasm32
      # WS / owner decision 2026-10-16: only geom, model and kernel require WASM compatibility.
      # The three domain rows in docs/contracts/f08-module-boundaries-v0.1.md define the list.
      - name: Check geom, model and kernel for wasm32
        run: |
          list="$(cargo run --locked --quiet -p beamcraft-boundaries -- portable)"
          echo "portable crates: $list"
          test -n "$list"
          cargo check --locked --target wasm32-unknown-unknown $list

  deny:
    needs: plan
    name: dependency licences and advisories
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  verdict:
    name: CI verdict
    if: always()
    runs-on: ubuntu-latest
    needs: [plan, quality, build-timings, wasm, deny]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Require all planned checks and distinguish intentional skips
        run: cargo run --locked -p beamcraft-test-gate -- ci-verdict
        env:
          GATE_NEEDS: ${{ toJSON(needs) }}
          GATE_OSES: ${{ needs.plan.outputs.oses }}
          GH_TOKEN: ${{ github.token }}
