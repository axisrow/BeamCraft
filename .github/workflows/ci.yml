name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # F07: committed fixtures must equal the generator output and their manifest digests.
      - name: Verify original fixtures
        run: cargo run -p beamcraft-fixtures -- verify --dir tests/fixtures/f07

      # F08: workspace manifests must obey the module table (also run by cargo test).
      - name: Check module boundaries
        run: cargo run --locked -p beamcraft-boundaries -- check

      - name: Docs
        if: runner.os == 'Linux'
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  test-archive:
    name: build test archive (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      # Keep the debug test profile and assertions, but omit bulky debug symbols from the archive.
      CARGO_PROFILE_TEST_DEBUG: 0
    strategy:
      fail-fast: false
      matrix:
        # Windows first: Tekla users are on Windows. macOS is covered by release builds.
        os: [windows-latest, ubuntu-latest]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-nextest@0.9.149

      - name: Build and archive tests
        run: cargo nextest archive --workspace --locked --archive-file nextest-archive.tar.zst

      # nextest archives do not contain rustdoc tests; keep them in the full cross-platform gate.
      - name: Test documentation
        run: cargo test --workspace --doc --locked

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nextest-archive-${{ matrix.os }}
          path: nextest-archive.tar.zst
          if-no-files-found: error

  test:
    name: test (${{ matrix.os }}, shard ${{ matrix.shard }}/8)
    needs: test-archive
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    timeout-minutes: 45
    steps:
      # The archive needs the matching revision's source tree for fixtures and runtime assets.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-nextest@0.9.149

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nextest-archive-${{ matrix.os }}
          path: nextest-archive

      - name: Run archived test partition
        # The tests read CARGO_TARGET_TMPDIR and CARGO_BIN_EXE_* with the
        # compile-time env!() macro, so the archive must be extracted to the
        # build job's exact layout (<workspace>/target), and <workspace>/
        # target/tmp must exist: the archive carries binaries only, while the
        # tests create their scratch dirs inside target/tmp. --extract-to .
        # refuses an existing <workspace>/target; --extract-overwrite unpacks
        # over it without wiping, so the pre-created tmp directory survives.
        run: mkdir -p target/tmp && cargo nextest run --archive-file nextest-archive/nextest-archive.tar.zst --extract-to . --extract-overwrite --no-fail-fast --partition hash:${{ matrix.shard }}/8

  build-timings:
    name: cold release (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: macos-latest, target: aarch64-apple-darwin }
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      # Download outside the measured interval, but never restore compiled objects.
      # Hosted macOS is useful evidence, not the reference Apple M5 acceptance.
      - run: cargo fetch --locked --target ${{ matrix.target }}
      - name: Measure compiler-cold release build
        run: bash tools/build-timings.sh --target ${{ matrix.target }} --output target/build-timings
        env:
          CARGO_NET_OFFLINE: "true"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: build-timings-${{ matrix.target }}
          path: |
            target/build-timings/metadata.txt
            target/build-timings/build.log
            target/build-timings/target/cargo-timings/*.html
          if-no-files-found: error

  wasm:
    name: wasm32 check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: wasm32
      # WS / owner decision 2026-10-16: only geom, model and kernel require WASM compatibility.
      # The three domain rows in docs/contracts/f08-module-boundaries-v0.1.md define the list.
      - name: Check geom, model and kernel for wasm32
        run: |
          list="$(cargo run --locked --quiet -p beamcraft-boundaries -- portable)"
          echo "portable crates: $list"
          test -n "$list"
          cargo check --locked --target wasm32-unknown-unknown $list

  deny:
    name: dependency licences and advisories
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
