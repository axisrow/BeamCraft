name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows first: Tekla users are on Windows. macOS is covered by release builds.
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      # F07: committed fixtures must equal the generator output and their manifest digests.
      - name: Verify original fixtures
        run: cargo run -p beamcraft-fixtures -- verify --dir tests/fixtures/f07

      # F08: workspace manifests must obey the module table (also run by cargo test).
      - name: Check module boundaries
        run: cargo run --locked -p beamcraft-boundaries -- check

      # Independent oracle (Python standard library) for hashes and analytical expectations.
      - name: Check fixture expectations independently
        if: runner.os == 'Linux'
        run: |
          python3 tools/fixtures/verify_expectations.py
          python3 tools/fixtures/test_verify_expectations.py

      - name: Docs
        if: runner.os == 'Linux'
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  build-timings:
    name: cold release (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: macos-latest, target: aarch64-apple-darwin }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      # Download outside the measured interval, but never restore compiled objects.
      # Hosted macOS is useful evidence, not the reference Apple M5 acceptance.
      - run: cargo fetch --locked --target ${{ matrix.target }}
      - name: Measure compiler-cold release build
        run: bash tools/build-timings.sh --target ${{ matrix.target }} --output target/build-timings
        env:
          CARGO_NET_OFFLINE: "true"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: build-timings-${{ matrix.target }}
          path: |
            target/build-timings/metadata.txt
            target/build-timings/build.log
            target/build-timings/target/cargo-timings/*.html
          if-no-files-found: error

  wasm:
    name: wasm32 check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: wasm32
      # WS / owner decision 2026-10-16: only geom, model and kernel require WASM compatibility.
      # The three domain rows in docs/contracts/f08-module-boundaries-v0.1.md define the list.
      - name: Check geom, model and kernel for wasm32
        run: |
          list="$(cargo run --locked --quiet -p beamcraft-boundaries -- portable)"
          echo "portable crates: $list"
          test -n "$list"
          cargo check --locked --target wasm32-unknown-unknown $list

  deny:
    name: dependency licences and advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
