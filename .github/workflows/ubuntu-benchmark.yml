name: Ubuntu CI benchmark

on:
  workflow_dispatch:
    inputs:
      shards:
        type: choice
        options: ['1', '4', '8']
        default: '8'
        description: '1 runs nextest in place; 4/8 use an archive'
      cache-mode:
        type: choice
        options: ['warmup', 'cold', 'warm']
        default: 'warmup'
        description: 'Per variant: cold once, warmup once (excluded), then three warm runs with exact cache hits'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

concurrency:
  group: ubuntu-benchmark-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-archive-ubuntu:
    if: inputs.shards != '1'
    name: build test archive (ubuntu-latest)
    runs-on: ubuntu-latest
    env:
      # Keep the debug test profile and assertions, but omit bulky debug symbols from the archive.
      CARGO_PROFILE_TEST_DEBUG: 0
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable

      - id: rust-cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # A cold run cannot restore or populate the warm namespace.
          prefix-key: benchmark-${{ inputs['cache-mode'] == 'cold' && format('cold-{0}-{1}', github.run_id, github.run_attempt) || 'warm' }}
          key: variant-${{ inputs.shards }}

      - name: Validate benchmark cache state
        shell: bash
        env:
          CACHE_MODE: ${{ inputs['cache-mode'] }}
          CACHE_HIT: ${{ steps.rust-cache.outputs.cache-hit }}
        run: |
          printf 'Cache mode: %s; exact cache hit: %s\n' "$CACHE_MODE" "${CACHE_HIT:-false}" >> "$GITHUB_STEP_SUMMARY"
          if [ "$CACHE_MODE" = warmup ]; then
            echo 'Warmup only: exclude this run from measured samples.' >> "$GITHUB_STEP_SUMMARY"
          elif [ "$CACHE_MODE" = warm ] && [ "$CACHE_HIT" != true ]; then
            echo 'INVALID warm sample: run warmup successfully on this ref and variant, then retry.' >> "$GITHUB_STEP_SUMMARY"
            echo '::error::Warm benchmark requires an exact cache hit; sample excluded.'
            exit 1
          elif [ "$CACHE_MODE" = cold ] && [ "$CACHE_HIT" = true ]; then
            echo '::error::Cold benchmark unexpectedly restored an exact cache hit; sample excluded.'
            exit 1
          fi

      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-nextest@0.9.149

      - name: Build and archive tests
        run: cargo nextest archive --workspace --locked --archive-file nextest-archive.tar.zst

      # nextest archives do not contain rustdoc tests; keep them in the full cross-platform gate.
      - name: Test documentation
        run: cargo test --workspace --doc --locked

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nextest-archive-ubuntu-latest
          path: nextest-archive.tar.zst
          compression-level: 0
          if-no-files-found: error

  test-ubuntu:
    name: test (ubuntu-latest, shard ${{ matrix.shard }}/${{ inputs.shards }})
    needs: test-archive-ubuntu
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(inputs.shards == '4' && '[1,2,3,4]' || '[1,2,3,4,5,6,7,8]') }}
    timeout-minutes: 45
    steps:
      # The archive needs the matching revision's source tree for fixtures and runtime assets.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-nextest@0.9.149

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nextest-archive-ubuntu-latest
          path: nextest-archive

      - name: Run archived test partition
        shell: bash
        run: mkdir -p target/tmp && cargo nextest run --archive-file nextest-archive/nextest-archive.tar.zst --extract-to . --extract-overwrite --no-fail-fast --partition hash:${{ matrix.shard }}/${{ inputs.shards }}

  test-in-place:
    if: inputs.shards == '1'
    name: test in place (ubuntu-latest)
    runs-on: ubuntu-latest
    env:
      # Keep the debug test profile and assertions, but omit bulky debug symbols from the archive.
      CARGO_PROFILE_TEST_DEBUG: 0
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable

      - id: rust-cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # A cold run cannot restore or populate the warm namespace.
          prefix-key: benchmark-${{ inputs['cache-mode'] == 'cold' && format('cold-{0}-{1}', github.run_id, github.run_attempt) || 'warm' }}
          key: variant-${{ inputs.shards }}

      - name: Validate benchmark cache state
        shell: bash
        env:
          CACHE_MODE: ${{ inputs['cache-mode'] }}
          CACHE_HIT: ${{ steps.rust-cache.outputs.cache-hit }}
        run: |
          printf 'Cache mode: %s; exact cache hit: %s\n' "$CACHE_MODE" "${CACHE_HIT:-false}" >> "$GITHUB_STEP_SUMMARY"
          if [ "$CACHE_MODE" = warmup ]; then
            echo 'Warmup only: exclude this run from measured samples.' >> "$GITHUB_STEP_SUMMARY"
          elif [ "$CACHE_MODE" = warm ] && [ "$CACHE_HIT" != true ]; then
            echo 'INVALID warm sample: run warmup successfully on this ref and variant, then retry.' >> "$GITHUB_STEP_SUMMARY"
            echo '::error::Warm benchmark requires an exact cache hit; sample excluded.'
            exit 1
          elif [ "$CACHE_MODE" = cold ] && [ "$CACHE_HIT" = true ]; then
            echo '::error::Cold benchmark unexpectedly restored an exact cache hit; sample excluded.'
            exit 1
          fi

      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-nextest@0.9.149

      - name: Build and run tests
        run: cargo nextest run --workspace --locked --no-fail-fast --status-level slow --final-status-level slow

      # nextest archives do not contain rustdoc tests; keep them in the full cross-platform gate.
      - name: Test documentation
        run: cargo test --workspace --doc --locked

