name: macOS icon acceptance

on:
  push:
    branches: ['feat/platform-icons']
  pull_request:
    paths:
      - '.github/workflows/macos-icon-acceptance.yml'
      - 'apps/beamcraft-ui/**'
      - 'assets/icons/**'
      - 'packaging/**'

permissions:
  contents: read

jobs:
  macos-icon:
    name: native Dock, Finder and Spotlight
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: macos-icon-aarch64

      - name: Build and package the native application
        run: |
          cargo build --profile dist --locked --target aarch64-apple-darwin -p beamcraft-cli -p beamcraft-ui
          bash packaging/package.sh aarch64-apple-darwin macos icon-acceptance

      - name: Capture the running app, Finder and Spotlight
        shell: bash
        run: |
          set -euo pipefail
          archive="beamcraft-icon-acceptance-aarch64-apple-darwin.tar.gz"
          mkdir -p "$RUNNER_TEMP/icon-acceptance" "$RUNNER_TEMP/icon-acceptance/screenshots"
          tar xzf "$archive" -C "$RUNNER_TEMP/icon-acceptance"
          app="$RUNNER_TEMP/icon-acceptance/beamcraft-icon-acceptance-aarch64-apple-darwin/BeamCraft.app"
          screenshots="$RUNNER_TEMP/icon-acceptance/screenshots"

          open "$app"
          sleep 6
          screencapture -x "$screenshots/dock.png"

          open -R "$app"
          sleep 3
          screencapture -x "$screenshots/finder.png"

          osascript <<'APPLESCRIPT'
          tell application "System Events"
            keystroke space using {command down}
            delay 1
            keystroke "BeamCraft"
            delay 3
          end tell
          APPLESCRIPT
          screencapture -x "$screenshots/spotlight.png"

          for image in "$screenshots"/*.png; do
            test -s "$image"
            test "$(stat -f %z "$image")" -gt 10000
          done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-icon-acceptance-screenshots
          path: ${{ runner.temp }}/icon-acceptance/screenshots/*.png
          if-no-files-found: error
