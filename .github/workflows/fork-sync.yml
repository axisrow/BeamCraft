name: Fork sync

# Upstream sync on a 5-minute cadence per the fork contract: the script is the
# single implementation (local run and cron share it), the cron adds only --yes.
# An idle run exits at the guard step before the toolchain, so the fast cadence
# costs seconds. A green run is silent by design; a red run is the alarm
# (owner decision). A true push-event trigger needs a secret on the upstream
# side; tracked in Apibim-com/BeamCraft issue #206.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# A cron run must not overlap itself. A race with a local sync is safe: the
# script's push is non-force, so the loser exits 4 and the next run redoes it.
concurrency:
  group: fork-sync
  cancel-in-progress: false

# The optional PAT is the only token that can push upstream commits touching
# .github/workflows/* (issue #234): granting `workflows: write` to the default
# token makes GitHub reject the whole workflow file as invalid (startup
# failure, bisected 2026-10-27), so the job keeps contents:write only. Set the
# optional FORK_SYNC_TOKEN secret to a PAT with repo and workflow scopes; an
# unset secret keeps the sync on the default token, which suffices for
# everything else. A PAT push also carries the account identity, so the synced
# master tip gets a CI verdict instead of the skipped bot-trigger run.
permissions:
  contents: write

jobs:
  sync:
    name: sync upstream master
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # ref: master keeps the script's current-branch guard green (a default
      # checkout detaches HEAD); the full history is needed for the merge base.
      # The token is optional: an unset FORK_SYNC_TOKEN falls back to the
      # default github.token, and a sync that touches workflow files then
      # stops at the push with the script's exit 4 until a PAT is set.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          fetch-depth: 0
          token: ${{ secrets.FORK_SYNC_TOKEN || github.token }}

      # The script guards on both remotes; checkout configures only origin.
      - name: Add the upstream remote
        run: git remote add upstream https://github.com/Apibim-com/BeamCraft.git

      # The fast cadence is cheap only if an idle run never reaches the
      # toolchain; the sync script re-fetches and re-checks on its own.
      - id: guard
        name: Early exit when upstream is unchanged
        run: |
          git fetch origin master
          git fetch upstream master
          pending="$(git rev-list --count origin/master..upstream/master)"
          echo "upstream commits not in origin/master: $pending"
          echo "pending=$pending" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        if: steps.guard.outputs.pending != '0'
        with:
          toolchain: stable
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: steps.guard.outputs.pending != '0'

      # Gate 3/3 in tools/fork-sync.sh runs cargo nextest; without this step
      # the gate dies with "no such command: nextest" and the sync rolls back
      # (exit 3). Same pinned version CI installs, so both gates run the same
      # test runner.
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        if: steps.guard.outputs.pending != '0'
        with:
          tool: cargo-nextest@0.9.149

      - name: Identify the committer
        if: steps.guard.outputs.pending != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Sync
        if: steps.guard.outputs.pending != '0'
        run: bash tools/fork-sync.sh sync --yes
