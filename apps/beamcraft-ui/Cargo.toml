[package]
name = "beamcraft-ui"
default-run = "beamcraft-ui"
description = "Native BeamCraft window and viewport."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[[bin]]
name = "beamcraft-ui"
path = "src/main.rs"

# Exact pins. Default features off, so egui's `default_fonts` (Ubuntu/Bitstream licences) is
# never enabled; the UI font is the admitted Inter read at run time from assets/fonts/inter.
# `accesskit` is off: on Linux it pulls zbus 5 crates (zbus_names, zvariant, zvariant_derive)
# that RustSec now flags as unmaintained; re-enabling it is an owner decision on those advisories.
# eframe builds from the patched fork branch pinned by the root `[patch.crates-io]`
# (https://github.com/Apibim-com/eframe, `patch/remove-default-icon-0.37.0`), which keeps
# eframe's own unattributed default icon out of the binary (issue #149) and on Windows sets the
# window icon from the executable's resource (`build.rs`); this crate always sets its own icon
# (`app::load_icon`).
[dependencies]
beamcraft-model.workspace = true
beamcraft-json.workspace = true
beamcraft-host = { path = "../../crates/host", version = "0.0.1" }
beamcraft-engine = { path = "../../crates/engine", version = "0.0.1" }
egui = { version = "=0.37.0", default-features = false }
# No hyperlink widgets or OpenUrl commands: the "links" feature only pulls the
# unused webbrowser/URL/ICU graph into every build.
eframe = { version = "=0.37.0", default-features = false, features = ["wgpu_no_default_features", "wayland", "x11", "clipboard"] }
# Only for a feature: load libwayland at run time, as eframe 0.36 did through
# smithay-clipboard. Without it eframe 0.37 links libwayland-client at build time, so the
# build needs its development package and the binary cannot start on a machine without it.
winit = { version = "=0.30.13", default-features = false, features = ["wayland-dlopen"] }
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "wgsl", "dx12", "vulkan", "metal"] }
pollster = "=1.0.1"
# Decode and resize the runtime application icon; PNG only.
image = { version = "=0.25.10", default-features = false, features = ["png"] }
# The parser epaint 0.37.0 uses at font init; validates Inter before egui can panic on it.
# Keep it on epaint's exact version, or the check can accept a file epaint then rejects.
skrifa = "=0.44.0"

# Native folder dialog on Windows and macOS (the system's own dialog through windows-sys or objc2).
# Linux has no dependency-free system dialog: the window asks the desktop's own dialog program
# instead (zenity or kdialog), see `crate::dialog`.
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
rfd = { version = "=0.17.2", default-features = false }

[lints]
workspace = true
