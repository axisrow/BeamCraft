[package]
name = "beamcraft-cli"
default-run = "beamcraft"
description = "Command-line interface for BeamCraft."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
authors.workspace = true
# The integration suites build into one `cli` test binary (`tests/cli.rs`): one link instead of
# one per suite, and `cargo test` schedules every case on one thread pool instead of running
# the suites one after another. `macos_icon` checks the desktop app's icon and stays separate.
autotests = false

[[bin]]
name = "beamcraft"
path = "src/main.rs"

[[test]]
name = "cli"
path = "tests/cli.rs"

[[test]]
name = "macos_icon"
path = "tests/macos_icon.rs"

[dependencies]
beamcraft-model.workspace = true
beamcraft-engine = { path = "../../crates/engine", version = "0.0.1" }
beamcraft-host = { path = "../../crates/host", version = "0.0.1" }
beamcraft-json.workspace = true
beamcraft-layer-engine = { path = "../../crates/layer-engine", version = "0.0.1" }
beamcraft-ifc = { path = "../../crates/ifc", version = "0.0.1" }

[lints]
workspace = true
