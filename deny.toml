# cargo-deny policy. Third-party dependencies use permissive licences only.
# MPL-2.0 is allowed only for the explicitly listed BeamCraft workspace packages.
# Third-party copyleft (GPL, AGPL, LGPL) is never linked.
# Copyleft tools may run only as external oracle processes. See AGENTS.md.
# Official OpenUSD TOST use has a scoped exception in AGENTS.md section 1.2.
# U01 adds exactly openusd 0.8.0 to this Cargo graph. TOST is not allowed globally;
# its exact package exception and file-level provenance are recorded below and in ATTRIBUTION.md.
# The `openusd` crate 0.8.x declares MIT, but its file src/usd/core_schemas.rs is covered by
# TOST-1.0 (owner decision 2026-10-15, AGENTS.md section 1.2). cargo-deny reads only the manifest
# and cannot see that per-file licence. U01 records the exact package/version exception and
# preserves the existing TOST licence and notice; full redistribution notice review remains open.
# The N01 spike remains outside the workspace graph.

[graph]
all-features = true

[licenses]
confidence-threshold = 0.9
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "BSL-1.0",
    "CC0-1.0",
]

[licenses.private]
ignore = true

[[licenses.exceptions]]
name = "beamcraft-geom"
version = "0.0.1"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
name = "beamcraft-kernel"
version = "0.0.1"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
name = "beamcraft-model"
version = "0.0.1"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
name = "beamcraft-engine"
version = "0.0.1"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
name = "beamcraft-ifc"
version = "0.0.1"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
name = "beamcraft-protocol"
version = "0.0.1"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
name = "beamcraft-host"
version = "0.0.1"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
name = "beamcraft-cli"
version = "0.0.1"
allow = ["MPL-2.0"]

# U01 native adapter; exact per-package exceptions, no global allowlist change.
[[licenses.exceptions]]
name = "beamcraft-ui"
version = "0.0.1"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
name = "beamcraft-layer-engine"
version = "0.0.1"
allow = ["MPL-2.0"]

# MIT manifest plus the exact core_schemas.rs TOST file admitted by AGENTS section 1.2.
# File-level TOST provenance and retained licence/NOTICE are recorded in ATTRIBUTION.md.
[[licenses.exceptions]]
name = "openusd"
version = "0.8.0"
allow = ["MIT", "LicenseRef-TOST-1.0"]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# V01.0 (docs/audits/ui-stack-audit-v0.1.md): admit storytold/craft-libs only at
# rev 83bf4cb25c01ed46e7645c4172974239868aaf06, and only for craft-ui and craft-quit.
# cargo-deny 0.20.2 matches this URL, not the revision. required-git-spec forces a
# rev pin; it does not bind the URL to that commit. Do not depend on craft-print,
# craft-pdf, craft-cms, or this repo's vendored PDF trees under this entry.
allow-git = ["https://github.com/storytold/craft-libs"]
required-git-spec = "rev"

[advisories]
yanked = "warn"
# `zip` 8.6.0 is pulled in only by `openusd` 0.8.0, which requires `zip ^8.2.0`, so the patched
# 9.x line cannot be selected. All three advisories concern `ZipArchive::extract` and
# `ZipStreamReader::extract` (symlink and permission handling during extraction). `openusd` only
# reads archive entries into memory (`ZipArchive::new` plus entry reads; no `extract` call outside
# its tests) and BeamCraft never extracts archives to disk. Revisit when `openusd` moves to
# `zip` 9 or when a USDZ extraction path is added.
ignore = [
    { id = "RUSTSEC-2026-0367", reason = "zip extract() only; openusd 0.8.0 never extracts, BeamCraft never extracts archives" },
    { id = "RUSTSEC-2026-0368", reason = "zip extract() only; openusd 0.8.0 never extracts, BeamCraft never extracts archives" },
    { id = "RUSTSEC-2026-0369", reason = "zip extract() only; openusd 0.8.0 never extracts, BeamCraft never extracts archives" },
]
